---
layout: default
---

<article class="e34-post">
  <p><a href="{{ '/e34/' | relative_url }}">&larr; Back to e34</a></p>

  <h1>{{ page.title }}</h1>
  <p class="e34-post-date">{{ page.date | date: "%B %-d, %Y" }}</p>

  {% if page.cover %}
    <img class="e34-cover" src="{{ page.cover | relative_url }}" alt="{{ page.title }}">
  {% endif %}

  <div class="e34-post-content">
    {{ content }}
  </div>
</article>
